<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <rect width="1200" height="240" fill="#0d0d0d"/>

  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="0.35" y2="0">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0.85" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <g opacity="0.9">
    <!-- RIGHT SIDE: Dense contour lines flowing right-to-left, fading into darkness on the left -->
    <!-- Top band - thinner -->
    <path d="M 1200,18 C 1100,15 1020,22 940,16 C 860,10 760,22 680,14 C 600,8 520,18 450,12 C 400,8 370,15 340,12" fill="none" stroke="white" stroke-width="0.6" opacity="0.20"/>
    <path d="M 1200,28 C 1100,25 1020,32 940,26 C 860,20 760,32 680,24 C 600,18 520,28 450,22 C 400,18 370,25 340,22" fill="none" stroke="white" stroke-width="0.6" opacity="0.22"/>
    <path d="M 1200,38 C 1100,35 1020,42 940,36 C 860,30 760,42 680,34 C 600,28 520,38 450,32 C 400,28 370,35 340,32" fill="none" stroke="white" stroke-width="0.7" opacity="0.25"/>
    <path d="M 1200,48 C 1100,45 1020,52 940,46 C 860,40 760,52 680,44 C 600,38 520,48 450,42 C 400,38 370,45 340,42" fill="none" stroke="white" stroke-width="0.7" opacity="0.28"/>

    <!-- Middle band - thicker, main body -->
    <path d="M 1200,58 C 1100,55 1020,62 940,56 C 860,50 760,62 680,54 C 600,48 520,58 450,52 C 400,48 370,55 340,52" fill="none" stroke="white" stroke-width="0.8" opacity="0.32"/>
    <path d="M 1200,68 C 1100,65 1020,72 940,66 C 860,60 760,72 680,64 C 600,58 520,68 450,62 C 400,58 370,65 340,62" fill="none" stroke="white" stroke-width="0.8" opacity="0.36"/>
    <path d="M 1200,78 C 1100,75 1020,82 940,76 C 860,70 760,82 680,74 C 600,68 520,78 450,72 C 400,68 370,75 340,72" fill="none" stroke="white" stroke-width="0.9" opacity="0.40"/>
    <path d="M 1200,88 C 1100,85 1020,92 940,86 C 860,80 760,92 680,84 C 600,78 520,88 450,82 C 400,78 370,85 340,82" fill="none" stroke="white" stroke-width="1.0" opacity="0.45"/>
    <path d="M 1200,98 C 1100,95 1020,102 940,96 C 860,90 760,102 680,94 C 600,88 520,98 450,92 C 400,88 370,95 340,92" fill="none" stroke="white" stroke-width="1.2" opacity="0.50"/>
    
    <!-- CORE: thickest lines before the dome -->
    <path d="M 1200,108 C 1100,105 1020,112 940,106 C 860,100 760,112 680,104 C 600,98 520,108 450,102 C 400,98 370,105 340,102" fill="none" stroke="white" stroke-width="1.4" opacity="0.58"/>
    <path d="M 1200,118 C 1100,115 1020,122 940,116 C 860,110 760,122 680,114 C 600,108 520,118 450,112 C 400,108 370,115 340,112" fill="none" stroke="white" stroke-width="1.5" opacity="0.65"/>
    <path d="M 1200,128 C 1100,125 1020,132 940,126 C 860,120 760,132 680,124 C 600,118 520,128 450,122 C 400,118 370,125 340,122" fill="none" stroke="white" stroke-width="1.5" opacity="0.65"/>

    <!-- DOME / ARCH feature: lines rise up in center-right, dip back down -->
    <path d="M 1200,138 C 1100,135 1020,140 950,132 C 880,124 800,110 740,104 C 680,98 600,88 520,94 C 460,98 400,100 340,98" fill="none" stroke="white" stroke-width="1.4" opacity="0.58"/>
    <path d="M 1200,148 C 1100,145 1020,150 950,142 C 880,134 800,120 740,114 C 680,108 600,98 520,104 C 460,108 400,110 340,108" fill="none" stroke="white" stroke-width="1.2" opacity="0.50"/>
    <path d="M 1200,158 C 1100,155 1020,160 950,152 C 880,144 800,130 740,124 C 680,118 600,108 520,114 C 460,118 400,120 340,118" fill="none" stroke="white" stroke-width="1.0" opacity="0.45"/>
    <path d="M 1200,168 C 1100,165 1020,170 950,162 C 880,154 800,142 740,136 C 680,130 600,120 520,126 C 460,130 400,132 340,130" fill="none" stroke="white" stroke-width="0.9" opacity="0.40"/>

    <!-- Post-dome recovery - lines settle -->
    <path d="M 1200,178 C 1100,175 1020,180 950,172 C 880,164 800,154 740,148 C 680,142 600,134 520,140 C 460,144 400,146 340,144" fill="none" stroke="white" stroke-width="0.8" opacity="0.36"/>
    <path d="M 1200,188 C 1100,185 1020,190 950,182 C 880,174 800,166 740,160 C 680,154 600,148 520,154 C 460,158 400,160 340,158" fill="none" stroke="white" stroke-width="0.8" opacity="0.32"/>
    <path d="M 1200,198 C 1100,195 1020,200 950,192 C 880,184 800,178 740,172 C 680,166 600,162 520,168 C 460,172 400,174 340,172" fill="none" stroke="white" stroke-width="0.7" opacity="0.28"/>

    <!-- Bottom band -->
    <path d="M 1200,208 C 1100,205 1020,210 950,202 C 880,194 800,190 740,184 C 680,178 600,176 520,182 C 460,186 400,188 340,186" fill="none" stroke="white" stroke-width="0.7" opacity="0.25"/>
    <path d="M 1200,218 C 1100,215 1020,220 950,212 C 880,204 800,202 740,196 C 680,190 600,190 520,196 C 460,200 400,202 340,200" fill="none" stroke="white" stroke-width="0.6" opacity="0.22"/>
    <path d="M 1200,228 C 1100,225 1020,230 950,222 C 880,214 800,214 740,208 C 680,202 600,204 520,210 C 460,214 400,216 340,214" fill="none" stroke="white" stroke-width="0.6" opacity="0.18"/>

    <!-- Far right edge compression detail -->
    <path d="M 1200,15 C 1150,12 1100,18 1060,14" fill="none" stroke="white" stroke-width="0.4" opacity="0.12"/>
    <path d="M 1200,230 C 1150,228 1100,234 1060,230" fill="none" stroke="white" stroke-width="0.4" opacity="0.10"/>
  </g>

  <!-- Left fade overlay - gradual fade into black -->
  <rect x="0" y="0" width="380" height="240" fill="url(#fadeL)"/>
  
  <!-- Subtle right edge fade -->
  <rect x="1120" y="0" width="80" height="240" fill="url(#fadeR)"/>
</svg>
